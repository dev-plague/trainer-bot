name: Error
description: Algo no funciona como se espera
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. No incluyas datos personales ni secretos.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: El comportamiento observable, sin interpretarlo.
      placeholder: "Al pulsar «Empezar sesión», la pantalla se queda en blanco."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
      placeholder: "Debería mostrarse el primer ejercicio del día."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: En una lista numerada, desde el inicio de sesión si aplica.
      placeholder: |
        1. Entrar con una cuenta nueva
        2. Completar el onboarding
        3. Generar un plan
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Navegador y versión, móvil o escritorio, y el commit o PR si lo sabes.
      placeholder: "Safari 26, iPhone 15, commit abc1234"
  - type: textarea
    id: evidencia
    attributes:
      label: Logs o capturas
      description: Pega el texto del error o arrastra una captura. Revisa que no haya datos personales.
  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué en los issues abiertos y no está duplicado
          required: true
        - label: No incluí datos personales, secretos ni datos de salud reales
          required: true
